name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.nukadkart --project-name nukad_kart .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Nukad Kart"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk NukadKart.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Nukad Kart demo v0.1.${{ github.run_number }}
          body: |
            Customer app, demo data build. No real sign-in, orders or payments.
            Install: download NukadKart.apk on your Android phone and allow "Install unknown apps".
          files: NukadKart.apk
          make_latest: true
