name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.nukadkart --project-name nukad_kart .

      - name: Green launch screen (no logo)
        run: cp -r android_res/. android/app/src/main/res/

      - name: Microphone permission for voice search
        run: python3 tool/patch_manifest.py

      - name: Keep map library classes in release build
        run: cp android_extra/proguard-rules.pro android/app/proguard-rules.pro

      - name: Sign with the fixed Nukad Kart key
        run: |
          cp android_extra/upload.jks android/app/upload.jks
          cp android_extra/key.properties android/key.properties
          python3 tool/patch_gradle.py

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Nukad Kart"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Show signing certificate (must match Firebase SHA-1 16:86:5A:2A…)
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA256"

      - run: cp build/app/outputs/flutter-apk/app-release.apk NukadKart.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.${{ github.run_number }}
          name: Nukad Kart demo v0.6.${{ github.run_number }}
          body: |
            Customer app, demo data build. No real sign-in, orders or payments.
            Install: download NukadKart.apk on your Android phone and allow "Install unknown apps".
          files: NukadKart.apk
          make_latest: true
