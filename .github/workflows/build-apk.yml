name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.nukadkart --project-name nukad_kart .

      - name: Green launch screen (no logo)
        run: cp -r android_res/. android/app/src/main/res/

      - name: Microphone permission for voice search
        run: python3 tool/patch_manifest.py

      - name: Keep map library classes in release build
        run: cp android_extra/proguard-rules.pro android/app/proguard-rules.pro

      - name: Sign with the fixed Nukad Kart key (unlocked with the KEYSTORE_PASSWORD secret)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD secret missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android_extra/upload.jks.enc \
            -out android/app/upload.jks -pass env:KEYSTORE_PASSWORD
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=nukadkart\nstoreFile=upload.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          python3 tool/patch_gradle.py > /dev/null

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Nukad Kart"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Show signing certificate (must match Firebase SHA-1 93:52:A2:10…)
        run: |
          signer=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $signer verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/cert.txt
          grep -qi "SHA-1 digest: 9352a210781d39ee0c04efc3735fad0b5ea2b279" /tmp/cert.txt

      - run: cp build/app/outputs/flutter-apk/app-release.apk NukadKart.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          name: Nukad Kart v0.9.${{ github.run_number }}
          body: |
            Customer app. Real Google sign-in and SMS code; shops, orders and payments are still demo data.
            Install: download NukadKart.apk on your Android phone and allow "Install unknown apps".
          files: NukadKart.apk
          make_latest: true
