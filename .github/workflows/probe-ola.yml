name: Probe Ola Maps
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          KEY=$(grep olaMapsApiKey lib/config/keys.dart | cut -d"'" -f2)
          echo "::add-mask::$KEY"
          curl -s "https://api.olamaps.io/tiles/vector/v1/styles/default-light-standard/style.json?api_key=$KEY" -o style.json
          echo "STYLE BYTES: $(wc -c < style.json)"
          python3 - <<'PY'
          import json
          s=json.load(open('style.json'))
          print('top keys', list(s.keys()))
          print('sprite', str(s.get('sprite'))[:200])
          print('glyphs', str(s.get('glyphs'))[:200])
          for k,v in s.get('sources',{}).items():
              print('source', k, {a:(str(b)[:200]) for a,b in v.items()})
          PY
          echo ---REVERSE
          curl -s "https://api.olamaps.io/places/v1/reverse-geocode?latlng=28.7158,77.1135&api_key=$KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print(list(d.keys()));r=(d.get('results') or [{}])[0];print(json.dumps(r,indent=1)[:2500])"
          echo ---TILEJSON
          URL=$(python3 -c "import json;s=json.load(open('style.json'));print([v.get('url') for v in s['sources'].values() if v.get('url')][0])")
          echo "tilejson url: ${URL%%\?*}"
          curl -s "$URL$( [[ $URL == *\?* ]] && echo '&' || echo '?')api_key=$KEY" | head -c 600
