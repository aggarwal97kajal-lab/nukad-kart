name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/*.test.mjs

      - name: Check secrets are present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }

      - name: Find or create the D1 database (Asia-Pacific, near India)
        run: |
          # The first database was made from a US GitHub runner, so it lives in the US: every query from
          # India crossed the world. The data is copied once into a new database placed in Asia-Pacific.
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="nukad-kart-db-apac") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create nukad-kart-db-apac --location apac
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="nukad-kart-db-apac") | .uuid')
          fi
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          # Copy once: only while the new database has no migrations table yet.
          if ! $WRANGLER d1 execute nukad-kart-db-apac --remote --command "SELECT COUNT(*) AS n FROM d1_migrations" > /dev/null 2>&1; then
            old=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="nukad-kart-db") | .uuid')
            if [ -n "$old" ]; then
              $WRANGLER d1 export nukad-kart-db --remote --output /tmp/dump.sql
              grep -q 'd1_migrations' /tmp/dump.sql || { echo "::error::export has no migrations table"; exit 1; }
              python3 tool/split_dump.py /tmp/dump.sql /tmp/dump_split.sql
              $WRANGLER d1 execute nukad-kart-db-apac --remote --file /tmp/dump_split.sql
              $WRANGLER d1 execute nukad-kart-db-apac --remote --command "SELECT (SELECT COUNT(*) FROM d1_migrations) AS migrations, (SELECT COUNT(*) FROM stores) AS stores, (SELECT COUNT(*) FROM users) AS users, (SELECT SUM(LENGTH(photo)) FROM store_photos) AS photo_bytes"
            fi
          fi
          [ -n "$id" ] || { echo "could not get database id"; exit 1; }
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          echo "D1 database: $id"

      - name: File storage (R2) for photos and documents
        run: |
          out=$($WRANGLER r2 bucket create nukad-kart-files 2>&1) || true
          echo "$out" | tail -3
          if $WRANGLER r2 bucket list 2>/dev/null | grep -q 'nukad-kart-files'; then
            echo "R2 bucket ready"
          else
            echo "::warning::R2 is not switched on for this Cloudflare account yet. Photos and documents stay in the database. Turn on R2 in the Cloudflare dashboard (R2 Object Storage) and deploy again."
            sed -i '/# R2-BEGIN/,/# R2-END/d' wrangler.toml
          fi

      - name: Apply database migrations
        run: $WRANGLER d1 migrations apply nukad-kart-db-apac --remote

      - name: Deploy worker
        run: $WRANGLER deploy

      - name: Push notifications key (only if the FCM_SERVICE_ACCOUNT secret is set in GitHub)
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -e '.client_email and .private_key and .project_id' > /dev/null || { echo "::error::FCM_SERVICE_ACCOUNT is not a Firebase service-account JSON"; exit 1; }
            printf '%s' "$FCM_SERVICE_ACCOUNT" | $WRANGLER secret put FCM_SERVICE_ACCOUNT
          else
            echo "::warning::FCM_SERVICE_ACCOUNT secret not set: push notifications are off."
          fi

      - name: Create session secret once
        run: |
          if ! $WRANGLER secret list --format json | jq -e '.[] | select(.name=="SESSION_SECRET")' >/dev/null; then
            openssl rand -hex 32 | $WRANGLER secret put SESSION_SECRET
          fi
          if ! $WRANGLER secret list --format json | jq -e '.[] | select(.name=="MSG91_AUTHKEY")' >/dev/null; then
            echo "::warning::MSG91_AUTHKEY not set yet. Phone check will return 503 until you add it in Cloudflare."
          fi

      - name: Smoke test
        run: |
          base=https://nukad-kart-api.aggarwal97kajal.workers.dev
          for i in 1 2 3 4 5 6; do curl -fsS $base/health && break; sleep 10; done
          echo; for i in 1 2 3; do curl -s -o /dev/null -w 'health %{time_total}s\n' $base/health; done
          echo
          curl -fsS "$base/v1/stores/nearby?lat=28.718&lng=77.096" | tee /tmp/near.json
          echo
          jq -e '.count == 3 and ([.stores[].id] | index("s9") == null)' /tmp/near.json
          code=$(curl -s -o /dev/null -w '%{http_code}' $base/v1/me)
          [ "$code" = 401 ] || { echo "expected 401 without sign-in, got $code"; exit 1; }
