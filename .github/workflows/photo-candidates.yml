name: Photo candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tool/fetch_photo_candidates.py
      - name: Push to the photo-candidates branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan photo-candidates
          git rm -rq --cached .
          git add candidates
          git commit -qm "Photo candidates"
          git push -f origin photo-candidates
