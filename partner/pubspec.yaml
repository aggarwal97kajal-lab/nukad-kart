name: nukad_partner
description: Nukad Partner — app for shops and thelas on Nukad Kart.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  geolocator: ^14.0.0
  url_launcher: ^6.3.1
  maplibre_gl: ^0.26.2
  sendotp_flutter_sdk: ^0.0.2
  file_picker: ^10.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  file_saver: ^0.7.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  image: ^4.5.4
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDC731"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/agreement_v1.txt
    - assets/categories/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/NotoSans-Regular.ttf
        - asset: assets/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/NotoSans-ExtraBold.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/NotoSansDevanagari-Regular.ttf
        - asset: assets/NotoSansDevanagari-Bold.ttf
          weight: 700

dependency_overrides:
  image: 4.5.4
