name = "nukad-kart-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Run the worker next to the database when that is faster (the app makes several queries per request).
[placement]
mode = "smart"

# Every 5 minutes: hide thelas whose location stopped and tell the seller.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Google "Web client" ID(s) from Firebase, comma separated. Filled in once Google sign-in is enabled.
GOOGLE_CLIENT_IDS = "173237735756-8p39j4pk1ekmtuvepo32enp4beqtst9g.apps.googleusercontent.com"
# Admins: SHA-256 of their lower-case Google email, comma separated (the emails stay out of this public repo).
ADMIN_EMAIL_HASHES = "1f5ddeb49d81be5faaa661510ca92c35d8d67e96e4bb5d5464ca4dabaad3057d"
# The UPI ID for pass payments is set by an admin in the Partner app (stored in the database).

[[d1_databases]]
binding = "DB"
database_name = "nukad-kart-db-apac"
database_id = "__D1_ID__"
migrations_dir = "migrations"

# Secrets (never in this file):
#   SESSION_SECRET  - created automatically by the deploy workflow
#   MSG91_AUTHKEY   - add yourself in Cloudflare: Workers > nukad-kart-api > Settings > Variables and Secrets

# Shop photos and partner documents (R2 object storage). The deploy workflow creates the bucket;
# if R2 is not switched on for the account yet, it removes this block and files stay in the database.
# R2-BEGIN
[[r2_buckets]]
binding = "FILES"
bucket_name = "nukad-kart-files"
# R2-END
