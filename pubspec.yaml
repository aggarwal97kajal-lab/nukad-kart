name: nukad_kart
description: "Nukad Kart - Apne Nukkad Ki Har Dukaan! Customer app (demo data build)."
publish_to: 'none'
version: 0.9.7+24

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  sendotp_flutter_sdk: ^0.0.2
  maplibre_gl: ^0.26.2
  geolocator: ^14.0.0
  google_sign_in: ^7.1.0
  http: ^1.2.2
  printing: ^5.14.2
  file_saver: ^0.7.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  device_info_plus: ^11.3.0
  pdf: ^3.11.3

# image 4.11 calls an archive method that the archive version picked here does not have.
dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDC732"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/stores/
    - assets/images/categories/
    - assets/images/markers/
  fonts:
    # Noto Sans (SIL Open Font Licence) — brand guidelines "Golden Corner"
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
