# The website nukkadkart.in (static files in public/). The API stays a separate worker at api.nukkadkart.in.
name = "nukkadkart-site"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "nukkadkart.in", custom_domain = true },
  { pattern = "www.nukkadkart.in", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# The worker runs first so www goes to nukkadkart.in and every page gets the security headers.
run_worker_first = true
